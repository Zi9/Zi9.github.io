<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>&lt;3 ✏️</title>
    <style>
        body {
            background-color: #222;
            display: flex;
            flex-wrap: nowrap;
            flex-direction: column;
            align-items: center;
            height: 90vh;
            justify-content: center;
            gap: 30px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        button {
            width: 90px;
            padding: 10px;
            background-color: #555;
            border: none;
            color: white;
            border-radius: 3px;
        }
        .icon {
            font-size: 72pt;
        }
        .authorinfo {
            color: #666;
            font-size: 10pt;
            position: absolute;
            right: 0;
            top: 0;
        }
        .sent {
            color: #AFA;
            opacity: 0;
            transition: opacity 0.5s;
        }
        .visible {
            opacity: 100;
        }
        #container {
            display: grid;
            grid-template-columns: repeat(128, 1fr);
            grid-template-rows: repeat(32, 1fr);
            background-color: #888;
        }
        .pixel {
            width: 8px;
            height: 8px;
        }
        .pixel-on {
            background-color: white;
        }
        .pixel-off{
            background-color: black;
        }
    </style>
</head>

<body>
    <p class="icon">✨✏️</p>
    <button id="colorBtn" onclick="SwitchColor()">🔲</button>
    <div id="container"></div>
    <button onclick="SendDrawing()">✏️⌨️</button>
    <p class="sent">Drawing Sent!</p>
    <p class="authorinfo">Made with ❤️ by ⚡</p>
    <script>
        var drawWhite = true;
        function SwitchColor() {
            drawWhite = !drawWhite;
            if (drawWhite) {
                document.getElementById("colorBtn").innerText = "🔲";
            } else {
                document.getElementById("colorBtn").innerText = "🔳";
            }
        }
        function BuildData() {
            var input = "";
            var elems = document.getElementById("container").childNodes;
            elems.forEach(element => {
                if (element.classList.contains("pixel-on")) {
                    input += "o";
                } else {
                    input += "x";
                }
            });
            
            let encoded = "";
            let count = 1;

            for (let i = 1; i < input.length; i++) {
                if (input[i] === input[i - 1]) {
                    count++;
                } else {
                    encoded += input[i - 1] + count;
                    count = 1;
                }
            }
            if (input.length > 0) {
                encoded += input[input.length - 1] + count;
            }
            console.log(encoded);
            return encoded;
        }
        function SendDrawing() {
            var params = {
                "content": BuildData()
            }
            var url = atob("aHR0cHM6Ly9kaXNjb3JkLmNvbS9hcGkvd2ViaG9va3MvMTA2MTYzNTE4OTk0NTY3NTg4OC81S05EaUxlOUhUcTQtWGhFSjVmd3hrM3RNRFdMMHB5RlFfVUdvV3pGaER0a2dPaUtVZWVUZEVYblN6WDgxaS1nLUx0WAo=");
            var xhr = new XMLHttpRequest();
            xhr.open("POST", url, true);
            xhr.setRequestHeader('Content-type', 'application/json');
            xhr.send(JSON.stringify(params));
            xhr.onreadystatechange = function () {
                if (this.status != 200) {
                    document.getElementsByClassName("sent")[0].classList.add("visible");
                }
            }
        }
        function ToggleCell(cell) {
            if (drawWhite) {
                if (cell.classList.contains("pixel-off")) {
                    cell.classList.remove("pixel-off");
                    cell.classList.add("pixel-on");
                }
            } else {
                if (cell.classList.contains("pixel-on")) {
                    cell.classList.remove("pixel-on");
                    cell.classList.add("pixel-off");
                }
            }
        }
        function GenerateGrid() {
            var container = document.getElementById("container");
            for (let x = 0; x < 128*32; x++) {
                var item = document.createElement("div");
                item.draggable = false;
                item.classList.add("pixel");
                item.classList.add("pixel-off");
                container.appendChild(item);
                item.ondrag = function() {return false;}
                item.ondragstart = function() {return false;}
                item.ondrop = function() {return false;}
                item.ondragover = function() {return false;}
                item.onclick = function(ev) {
                    ToggleCell(this);
                    ev.stopPropagation();
                }
                item.onmouseenter = function(ev) {
                    if (ev.which == 1) {
                        ToggleCell(this);
                        ev.stopPropagation();
                    }
                }
            }
        }

        GenerateGrid();
    </script>
</body>

</html>
