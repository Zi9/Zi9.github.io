<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUT Scaler by Zi9</title>
    <meta name="description" content="Scaler for Assetto Corsa engine LUT files">
    <link rel="icon" type="image/x-icon" href="https://zi9.dev/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
    <style>
        body {
            background-color: #333;
            color: white;
            font-family: Roboto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        main {
            display: flex;
            flex-direction: column;
            max-width: fit-content;
            align-items: center;
        }
        button {
            background-color: #444;
            color: white;
            padding: 5px;
            border-width: 1px;
        }
        textarea {
            background-color: #444;
            color: white;
        }
        h3 {
            margin: 0;
        }
        p {
            text-align: center;
        }
        pre {
            color: #666;
        }
        hr {
            width: 100%;
            margin-bottom: 30px;
            margin-top: 0;
        }
        .sliders {
            display: grid;
            grid-template-columns: 4rem auto;
            grid-template-rows: auto;
            gap: 3px;
            width: 100%;
        }
        .slider {
            width: 100%;
            accent-color: #888;
        }
        .button-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(2, auto);
            gap: 3px;
        }

        .input-boxes {
            display: grid;
            gap: 10px;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: auto 40rem;
            padding-bottom: 10px;
        }
        #pwr-offset {
            text-align: center;
        }
        .utilbtn {
            margin-left: 5px;
        }
        .mainbox {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        #manualinput {
            height: 1rem;
        }
        .manual {
            display: grid;
            grid-template-columns: 8rem auto;
            grid-template-rows: auto;
            gap: 3px;
            width: 100%;
            align-items: center;
        }
    </style>
</head>

<body>
    <main>
        <h1>Engine LUT Scaler for AC</h1>
        <hr>
        <div class="mainbox">
            <div class="input-boxes">
                <h3>▼ Input LUT<button class="utilbtn" onclick="reformat()">Load/Update</button></h3>
                <h3>▼ Output LUT<button class="utilbtn" onclick="copy()">Copy</button><input type="checkbox" id="tabs" onclick="reformat()">Use Tabs</input></h3>
                <textarea id="input" onpaste="reformat()"></textarea>
                <textarea id="output" disabled></textarea>
            </div>
            <div>
                <h3 id="pwr-offset">Power offset: 0%<br>Peak Power: To be calculated</h3>
                <p id="pwr-detail">Slider: 0%<br>Multiplier: x1</p>
                <div class="sliders">
                    <p>Adjust:</p>
                    <input id="slider" type="range" class="slider" min="-100" max="100" value="0" step="0.001" oninput="updateValues()">
                </div>
                <div class="manual">
                    <p>Manual Input (%):</p>
                    <input id="manualinput" type="number" min="-1000" max="1000" value="0" step="0.001" oninput="updateValues(true)">
                </div>
                <div class="button-grid">
                    <button onclick="setMultiplier('+1')">+1%</button>
                    <button onclick="setMultiplier('+2')">+2%</button>
                    <button onclick="setMultiplier('+5')">+5%</button>
                    <button onclick="setMultiplier('+10')">+10%</button>
                    <button onclick="setMultiplier('x1.25')">x1.25</button>
                    <button onclick="setMultiplier('x1.50')">x1.50</button>
                    <button onclick="setMultiplier('x1.75')">x1.75</button>
                    <button onclick="setMultiplier('x2')">x2</button>
                    <button onclick="setMultiplier('-1')">-1%</button>
                    <button onclick="setMultiplier('-2')">-2%</button>
                    <button onclick="setMultiplier('-5')">-5%</button>
                    <button onclick="setMultiplier('-10')">-10%</button>
                    <button onclick="setMultiplier('x0.75')">x0.75</button>
                    <button onclick="setMultiplier('x0.50')">x0.50</button>
                    <button onclick="setMultiplier('x0.25')">x0.25</button>
                    <button onclick="setMultiplier('Reset')">Reset</button>
                </div>
            </div>
        </div>
        <pre>Made by Zi9 and powered by coffee. For questions / ideas contact me via Discord @ zi9</pre>
    </main>
</body>
<script>
    var slider = document.getElementById("slider");
    var manualinput = document.getElementById("manualinput");
    var pwrLabel = document.getElementById("pwr-offset");
    var detailLabel = document.getElementById("pwr-detail");
    var inputBox = document.getElementById("input");
    var outputBox = document.getElementById("output");
    var tabs = document.getElementById("tabs");
    var multiplier = 1;
    function copy() {
        navigator.clipboard.writeText(outputBox.textContent);
    }
    function reformat() {
        var output = "";
        var lines = inputBox.value.split('\n');
        for (let i = 0; i < lines.length; i++) {
            if (lines[i] == "") continue;
            var x = lines[i].split("|");
            var rpm = parseFloat(x[0]);
            var power = parseFloat(x[1]);
            output += `${rpm}|${power}\n`;
        }
        inputBox.value = output.trimEnd();
        updateValues();
    }
    function updateValues(manual = false) {
        if (manual) {
            var powerOffset = manualinput.value;
        } else {
            var powerOffset = (slider.value * multiplier).toFixed(1);
            manualinput.value = slider.value;
        }
        detailLabel.innerHTML = `Slider: ${slider.value}%<br>Multiplier: x${multiplier}`;
        var offset = powerOffset / 100.0;

        var output = "";
        var lines = inputBox.value.split('\n');
        var highestRPM = 0;
        var highestPower = 0;
        for (let i = 0; i < lines.length; i++) {
            if (lines[i] == "") continue;
            var x = lines[i].split("|");
            var rpm = parseFloat(x[0]);
            var power = parseFloat(x[1]);
            var adjusted = parseFloat(power+power*offset).toFixed(2);
            if (adjusted > highestPower) {
                highestPower = parseFloat(adjusted);
                highestRPM = parseFloat(rpm);
            }
            if (tabs.checked) {
                output += `${rpm}\t|\t${adjusted}\n`;
            }
            else {
                output += `${rpm}|${adjusted}\n`;
            }
        }
        pwrLabel.innerHTML = `Power offset: ${powerOffset}%<br>Peak power: ${highestPower}Nm/${((highestPower * highestRPM) / 7127.0).toFixed(2)}hp @ ${highestRPM}rpm`
        outputBox.textContent = output.trimEnd();
    }
    function setMultiplier(amount) {
        if (amount.startsWith("+")) {
            multiplier += parseFloat(amount.substring(1))/100.0;
        } else if (amount.startsWith("-")) {
            multiplier -= parseFloat(amount.substring(1))/100.0;
        } else if (amount.startsWith("x")) {
            multiplier *= parseFloat(amount.substring(1));
        } else {
            multiplier = 1;
            slider.value = 0;
        }
        multiplier = parseFloat(multiplier.toFixed(2));
        updateValues();
    }
</script>

</html>
